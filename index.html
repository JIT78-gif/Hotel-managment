<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Management – Task Board</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7f3ee; margin: 0; padding: 32px; color: #2b2118; }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 8px; border: 1px solid #c9b8a6; border-radius: 4px; }
    button { padding: 8px 16px; background: #8a5a2b; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    li { background: #fff; margin: 6px 0; padding: 10px; border-radius: 4px; list-style: none; }
  </style>
</head>
<body>
  <h1>Hotel Management – Staff Task Board</h1>
  <p>Add housekeeping or kitchen tasks for the current shift.</p>
  <form id="task-form">
    <input id="task-input" placeholder="e.g. Clean room 204" />
    <button type="submit">Add Task</button>
  </form>
  <ul id="task-list"></ul>
  <script>
    const isValid = (t) => typeof t === 'string' && t.trim().length > 0;
    document.getElementById('task-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      if (!isValid(input.value)) return;
      const li = document.createElement('li');
      li.textContent = input.value.trim();
      document.getElementById('task-list').appendChild(li);
      input.value = '';
    });
  </script>
</body>
</html>
